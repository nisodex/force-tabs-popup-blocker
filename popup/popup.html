<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Force Tabs Control</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header estilo Chrome -->
    <header class="header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="Logo" class="logo">
        <div class="brand-text">
          <h1 class="title">Force Tabs</h1>
          <span class="subtitle">Control de Ventanas Emergentes</span>
        </div>
      </div>
      <span class="version-tag">v1.1</span>
    </header>

    <!-- Master Switch Card -->
    <section class="card master-card">
      <div class="master-info">
        <span class="card-title">Protección global</span>
        <span id="masterStatusText" class="status-indicator active">Activada</span>
      </div>
      <label class="cr-switch" for="globalToggle">
        <input type="checkbox" id="globalToggle" checked>
        <span class="cr-slider"></span>
      </label>
    </section>

    <!-- Current Site Card -->
    <section class="card site-card">
      <div class="site-header">
        <span class="card-label">SITIO ACTUAL</span>
        <span id="siteBadge" class="badge badge-active">Protegido</span>
      </div>
      <div class="domain-display" id="currentDomain">Cargando...</div>
      <button id="toggleCurrentSiteBtn" class="cr-button cr-button-secondary btn-block">
        <span id="toggleSiteBtnText">Excluir este sitio</span>
      </button>
    </section>


    <!-- Settings & Whitelist Card -->
    <section class="card options-card">
      <div class="option-row">
        <div class="option-info">
          <span class="option-title">Permitir OAuth y Pasarelas</span>
          <span class="option-sub">Google, PayPal, Apple, Auth0</span>
        </div>
        <label class="cr-switch cr-switch-sm" for="oauthToggle">
          <input type="checkbox" id="oauthToggle" checked>
          <span class="cr-slider"></span>
        </label>
      </div>

      <hr class="divider">

      <div class="whitelist-section">
        <div class="section-title-row">
          <span class="option-title">Lista blanca de sitios</span>
          <span class="count-pill" id="whitelistCount">0</span>
        </div>

        <form id="addDomainForm" class="add-domain-form">
          <input type="text" id="domainInput" class="cr-input" placeholder="ejemplo.com" autocomplete="off" spellcheck="false" required>
          <button type="submit" class="cr-button cr-button-primary btn-sm">Añadir</button>
        </form>

        <ul class="whitelist-list" id="whitelistUl">
          <!-- Elementos dinámicos -->
        </ul>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
